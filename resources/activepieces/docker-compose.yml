# Bundled, lightweight Activepieces setup — the automation engine behind the Distribute screen.
#
# PGLITE + MEMORY mode needs no separate Postgres/Redis containers (single container is
# enough). Runs on a bare Docker Engine inside WSL2 (see electron/src/main/dockerRuntime.ts) —
# not Docker Desktop.
#
# AP_ENCRYPTION_KEY / AP_JWT_SECRET are per-user secrets generated once by
# electron/src/main/activepieces.ts and supplied via `docker compose --env-file <generated .env>`
# — never hardcoded here. AP_DATA_DIR points at a folder under Electron's userData dir so flows/
# connections/run-history persist across restarts and app updates.
services:
  activepieces:
    image: activepieces/activepieces:0.86.2
    container_name: mr-ai-marketer-activepieces
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      AP_DB_TYPE: PGLITE
      AP_REDIS_TYPE: MEMORY
      # Internal listen port must match the external mapping — Activepieces makes
      # self-referential calls to AP_FRONTEND_URL (e.g. registering a webhook trigger on
      # publish), and those calls happen *inside* the container, so a mismatched internal
      # port (the image's default AP_PORT=80 against a remapped 8081:80) makes them fail
      # with a generic "fetch failed" on every flow publish. Confirmed by reproducing the
      # failure and fixing it against a live instance.
      AP_PORT: "8081"
      AP_FRONTEND_URL: "http://localhost:8081"
      AP_ENCRYPTION_KEY: "${AP_ENCRYPTION_KEY}"
      AP_JWT_SECRET: "${AP_JWT_SECRET}"
    volumes:
      - "${AP_DATA_DIR}:/root/.activepieces"
