# Bundled Lead Gen Agent services — the self-hosted, free tools behind the
# Research/Strategy > "Lead Gen Agent" tool (and its CRM view in Analytics):
#   * reacher  — open-source email verification (replaces a paid verifier)
#   * searxng  — self-hosted metasearch for lead discovery (replaces a paid lead DB)
#   * ollama   — optional local LLM backend (opt-in profile, off by default)
#
# Runs on the same bare Docker Engine inside WSL2 already used for Activepieces (see
# electron/src/main/dockerRuntime.ts) — a second compose *stack* on the same shared
# daemon, not a second WSL distro/Docker install.
#
# The pipeline's OWN data (SQLite, the per-campaign GP model blob, the embedding cache)
# lives in DATA_DIR/leadgen on the Python side — NOT in a Docker volume. These services
# are stateless (reacher) or config-only (searxng); only optional Ollama keeps a volume
# for downloaded models. SEARXNG_SECRET is a per-user value generated once by
# electron/src/main/leadgen.ts and supplied via `docker compose --env-file <generated .env>`.
services:
  reacher:
    image: reacherhq/backend:latest
    container_name: mr-ai-marketer-leadgen-reacher
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      RCH__HTTP_HOST: "0.0.0.0"
      RCH__HTTP_PORT: "8080"
      # Reacher's own verification-history storage stays unset (defaults to none) — this
      # pipeline persists everything it needs (status, provenance) in its own leads table;
      # we only ever need Reacher's live per-call result, not its separate history.

  searxng:
    image: searxng/searxng:latest
    container_name: mr-ai-marketer-leadgen-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      # Bind SearXNG's self-referential base URL to the mapped host port so its own
      # links/health resolve; the JSON API we call is unaffected either way.
      SEARXNG_BASE_URL: "http://localhost:8083/"
    volumes:
      # A per-user settings.yml (written once by leadgen.ts from the bundled template,
      # with a generated secret_key baked in) enables the JSON response format that the
      # discovery client needs. Mounted read-only; SearXNG reads it at startup.
      - "${LEADGEN_SEARXNG_CONFIG_DIR}:/etc/searxng:ro"

  ollama:
    image: ollama/ollama:latest
    container_name: mr-ai-marketer-leadgen-ollama
    restart: unless-stopped
    profiles: ["ollama"] # opt-in only — `docker compose --profile ollama up -d`; not started by default
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - "${LEADGEN_DATA_DIR}/ollama:/root/.ollama"
