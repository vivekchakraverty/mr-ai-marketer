name: Feature request
description: Suggest something the app should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: this app deliberately runs on your own machine using
        your own accounts, and leans on free or nearly-free services. Suggestions that need a
        hosted server in the middle, or a paid API as the only option, are a hard fit — not
        impossible, but say how you'd square it.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done
      description: >
        The task, not the feature. "I want to schedule posts for next week" tells us more than
        "add a scheduler", because it leaves room for a better answer than the one you had in
        mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think should happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
      description: Another tool, a manual workaround, or nothing at all.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Research / Strategy
        - Create
        - Engage
        - Analytics
        - Manage
        - Community
        - Distribute
        - Library
        - Settings
        - A new tool that doesn't exist yet
        - Something else
    validations:
      required: true
